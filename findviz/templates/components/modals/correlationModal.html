<!-- Correlation Analysis Panel-->
<div class="modal fade" id="correlation-modal" tabindex="-1" aria-labelledby="correlation-modal-label" aria-hidden="true">
    <div class='spinner-overlay' id="correlate-spinner-overlay"></div>
    <div id='correlation-modal-dialog' class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="correlation-modal-label">相关分析</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <form id="correlation-form" enctype="multipart/form-data">
          <div class="modal-body">
            <!-- Correlation Spinner Wheel -->
            <div class="spinner-container d-flex justify-content-center">
              <div id='correlate-spinner-wheel' class="spinner-wheel" role="status"></div>
            </div>
            <div class='row'>
              <div class='col ml-3 mr-3'>
                <div class='row'>
                  <div class='col'>
                    <h5>选择时间序列</h5>
                    <select class="custom-select" id="ts-correlate-select">
                    </select>
                  </div>
                </div>
                <!-- Preprocess Alert -->
                <div class='row mt-1'>
                  <div class='alert alert-secondary mt-3 ml-3' id='correlate-prep-alert' role='alert' style=' display: none;'>
                    <i class='fa-solid fa-triangle-exclamation'></i>
                    <span class='mr-2'>使用预处理后的时间序列</span>
                  </div>
                </div>
                <div class='row mt-3'>
                  <div class='col ml-3 mr-3'>
                    <div class='row'>
                      <h5>互相关参数</h5>
                      <span class="fa-solid fa-circle-info ml-1 toggle-immediate" data-toggle="tooltip" data-placement="top" title="对所选时间序列在负滞后和正滞后范围内执行互相关，区间 [负滞后, 正滞后] 内所有滞后的相关值都会被计算。默认值为 [0,0]，即无滞后。" aria-hidden="true"></span>
                    </div>
                    <div class='row'>
                      <div class='col-6'>
                        <label for="correlate-negative-lag">负滞后</label>
                        <span class="fa-solid fa-circle-info ml-1 toggle-immediate" data-toggle="tooltip" data-placement="top" title="负滞后必须小于或等于 0。（默认值为 0，即无滞后）" aria-hidden="true"></span>
                        <input type="number" class="form-control" id="correlate-negative-lag" max="0" step="1" value="0">
                      </div>
                      <div class='col-6'>
                        <label for="correlate-positive-lag">正滞后</label>
                        <span class="fa-solid fa-circle-info ml-1 toggle-immediate" data-toggle="tooltip" data-placement="top" title="正滞后必须大于或等于 0。（默认值为 0，即无滞后）" aria-hidden="true"></span>
                        <input type="number" class="form-control" id="correlate-positive-lag" min="0" step="1" value="0">
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <div id="error-message-correlation" class="alert alert-danger" role='alert' style="display: none;"></div>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            <button type="submit" class="btn btn-primary" id='submit-correlation' data-dismiss="static">计算</button>
        </div>
        </form>
      </div>
    </div>
  </div>
