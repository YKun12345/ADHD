<!-- Time Course Visualization Options -->
<div class='row'>
  <div class='col-12 pr-0 pl-1'>
    <div class='card'>
      <div class="card-body pt-1 pb-2">
        <form>
          <!-- Select time course drop down -->
          <div class='row pt-0'>
            <label for="ts-select" class='small'><strong>选择时间序列</strong></label>
            <select class="custom-select w-100" id="ts-select">
              <!-- Options will be dynamically added here -->
            </select>
          </div>
          <!-- Time Course Color Selection Options -->
          <div class='row mt-1'>
            <div class='col-6 pr-3 pl-0'>
              <span class='small'><strong>颜色</strong></span>
              <select class="custom-select" id="ts-color-select">
                <option value="red">红色</option>
                <option value="blue">蓝色</option>
                <option value="green">绿色</option>
                <option value="orange">橙色</option>
                <option value="purple">紫色</option>
                <option value="black">黑色</option>
                <option value="grey">灰色</option>
                <option value="yellow">黄色</option>
                <option value="brown">棕色</option>
                <option value="darkred">深红色</option>
                <option value="tomato">番茄红</option>
                <option value="magenta">洋红色</option>
                <option value="crimson">猩红色</option>
                <option value="salmon">鲑红色</option>
                <option value="firebrick">砖红色</option>
                <option value="navy">海军蓝</option>
                <option value="royalblue">宝蓝色</option>
                <option value="turquoise">青绿色</option>
                <option value="coral">珊瑚色</option>
                <option value="seagreen">海绿色</option>
                <option value="forestgreen">森林绿</option>
                <option value="olive">橄榄色</option>
                <option value="darkgreen">深绿色</option>
                <option value="darkorange">深橙色</option>
                <option value="violet">紫罗兰色</option>
                <option value="slategrey">石板灰</option>
                <option value="slateblue">石板蓝</option>
                <option value="darkgrey">深灰色</option>
                <option value="khaki">卡其色</option>
                <option value="tan">浅棕色</option>
              </select>
            </div>
            <div class='col-6 pr-3 pl-0'>
              <span class='small'><strong>线型</strong></span>
              <select class="custom-select" id="ts-marker-select">
                <option value="lines+markers">线和点</option>
                <option value="lines">仅线</option>
                <option value="markers">仅点</option>
              </select>
            </div>
          </div>
          <div class='row mt-1'>
            <!-- Line Width and Opacity -->
            <div class='col-4 pr-3 pl-0' id="ts-width-slider-container">
              <label for="ts-width-slider" class='small mb-0'><strong>线宽</strong></label>
                <input id="ts-width-slider" type="text" class="slider" data-slider-responsive="true"/>
            </div>
            <div class='col-4 pr-3 pl-0' id="ts-opacity-slider-container">
              <label for="ts-opacity-slider" class='small mb-0'><strong>不透明度</strong></label>
              <input id="ts-opacity-slider" type="text" class="slider" data-slider-responsive="true"/>
            </div>
            <!-- Convolution with HRF checkbox-->
            <div class='col-4 pr-1 pl-1 d-flex align-items-end'>
              <div class="custom-control custom-checkbox">
                <input type="checkbox" id="ts-convolution-checkbox" class="custom-control-input">
                <label class="custom-control-label" for="ts-convolution-checkbox">HRF</label>
              </div>
              <span class="fa-solid fa-circle-info ml-1 pb-1 toggle-immediate" data-toggle="tooltip" data-placement="top" title="是否使用标准 HRF 对时间序列进行卷积（仅任务设计输入）。" aria-hidden="true"></span>
            </div>
          </div>
          <!-- Time Course Shift Options -->
          <div class='row mt-1'>
            <div class='col-6 pr-3 pl-0'>
              <span class='small mb-0'><strong>常数偏移</strong></span>
              <div class="row no-gutters">
                <div class="col-4 pr-1">
                  <button class="btn btn-outline-secondary btn-sm w-100" type="button" id='ts-increase-constant'>
                    <i class="fa-solid fa-arrow-up"></i>
                  </button>
                </div>
                <div class="col-4 pr-1">
                  <button class="btn btn-outline-secondary btn-sm w-100" type="button" id='ts-decrease-constant'>
                    <i class="fa-solid fa-arrow-down"></i>
                  </button>
                </div>
                <div class="col-4">
                  <button class="btn btn-outline-secondary btn-sm w-100 text-center justify-content-center align-items-center" type="button" id='ts-reset-constant'>
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class='col-6 pr-3 pl-0'>
              <span class='small mb-0'><strong>缩放偏移</strong></span>
              <div class="row no-gutters">
                <div class="col-4 pr-1">
                  <button class="btn btn-outline-secondary btn-sm w-100" type="button" id='ts-increase-scale'>
                    <i class="fa-solid fa-arrow-up"></i>
                  </button>
                </div>
                <div class="col-4 pr-1">
                  <button class="btn btn-outline-secondary btn-sm w-100" type="button" id='ts-decrease-scale'>
                    <i class="fa-solid fa-arrow-down"></i>
                  </button>
                </div>
                <div class="col-4">
                  <button class="btn btn-outline-secondary btn-sm w-100 text-center justify-content-center align-items-center" type="button" id='ts-reset-scale'>
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
