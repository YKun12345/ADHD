<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星仔助手 | 知行合医</title><link rel="stylesheet" href="../doctor-web/css/care-workbench.css"><style>[hidden]{display:none!important}select,textarea{max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:110px}.care-card p{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:1rem 0}.care-card{margin:1rem 0;padding:1rem;border:1px solid #cbd5e1;border-radius:12px}button{margin:.3rem}#agentActions{display:flex;flex-wrap:wrap}</style></head>
<body><nav class="care-nav"><a href="patient_home.html">我的首页</a><a href="patient_assessments.html">我的评估</a><a href="patient_ai.html" aria-current="page">星仔助手</a></nav>
<main id="agentShell" class="care-shell" data-agent-role="patient"><h1>星仔助手</h1><p>根据本人或监护范围内的实际资料核对下一步。筛查和草稿不能代替医生专业意见。</p>
<label>当前获准档案<select id="agentProfile"></select></label><label>实际评估<select id="agentAssessment"></select></label>
<form id="agentForm"><label>处理内容<select id="agentIntent"><option value="question">当前业务问答</option><option value="assessment_summary">本轮材料摘要</option></select></label>
<label>问题<textarea id="agentInput" maxlength="2000" placeholder="说明需要核对的实际问题"></textarea></label><button id="agentSend" type="submit" disabled>提交给助手</button></form>
<button id="agentRefresh" type="button">重新读取</button><button id="agentQuery" type="button" hidden>按原编号查询</button><button id="agentRetry" type="button" hidden>确认重试原请求</button>
<p id="agentMessage" role="status" aria-live="polite">正在读取当前获准资料…</p><section><h2>当前可执行的下一步</h2><div id="agentActions"></div></section><section><h2>本账号的私有助手记录</h2><div id="agentHistory"></div></section></main>
<script src="js/session-guard.js?v=20261018-flow"></script><script src="js/api.js?v=20261018-flow"></script><script src="js/agent-original.js?v=20261018-flow"></script><script src="js/agent-flow.js?v=20261018-flow"></script><script src="js/agent-companion-ui.js?v=20261018-flow"></script><script src="js/unified-agent.js?v=20261018-flow"></script></body></html>
