<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人档案 | 知行合“医”</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/patient.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="../doctor-web/css/account-profile.css?v=20261010c">
</head>
<body class="bg-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <ion-icon name="analytics"></ion-icon>
                <span>知行合“医”</span>
            </div>
            <ul class="nav-links">
                <li><a href="patient_home.html">首页</a></li>
                <li><a href="patient_scale.html">行为量表</a></li>
                <li><a href="patient_test.html">认知测试</a></li>
                <li><a href="patient_tracking.html">14天追踪</a></li>
                <li><a href="patient_report.html">我的报告</a></li>
                <li><a href="clinical_pathway.html">我的路径</a></li>
                <li><a href="patient_education.html">科普</a></li>
            </ul>
            <div class="nav-actions">
                <a href="patient_ai.html" class="icon-btn" title="AI助手">
                    <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
                </a>
                <div class="user-profile">
                    <ion-icon name="person-circle" style="color: var(--primary-blue);"></ion-icon>
                    <a href="patient_profile.html" style="color: var(--primary-blue); text-decoration: none; font-weight: 700;"><span id="userName">个人中心</span></a>
                </div>
            </div>
        </div>
    </nav>

    <main class="info-block account-main">
        <div class="info-container">
            <h1 class="account-title">个人健康档案中心</h1>
            <section class="account-layout" id="accountProfile" data-account-role="patient">
                <div class="todo-widget account-card account-identity">
                    <ion-icon name="person-circle" class="account-avatar"></ion-icon>
                    <h3 id="accountName">正在加载</h3>
                    <p id="accountUid" class="account-uid">UID: —</p>
                    <button type="button" id="accountLogout" class="btn-outline account-logout"><ion-icon name="log-out-outline"></ion-icon>退出登录</button>
                </div>
                <div class="todo-widget account-card">
                    <div class="todo-header account-header"><h3>账号信息与系统授权</h3></div>
                    <dl class="account-details">
                        <dt>登录邮箱</dt><dd id="accountEmail">—</dd>
                        <dt>账号身份</dt><dd id="accountRole">—</dd>

                        <dt>协议确认</dt><dd id="accountConsent">—</dd>
                    </dl>
                    <p id="accountScope" class="account-scope"></p>
                    <div class="account-actions">
                        <a href="patient_home.html" class="btn-outline">返回首页</a>
                        <a href="patient_report.html" class="btn-outline">查看我的报告</a>
                        <button type="button" id="accountRetry" class="btn-outline" hidden>重新加载</button>
                    </div>
                    <p id="accountStatus" class="account-status" role="status" aria-live="polite"></p>
                </div>
            </section>
        </div>
    </main>

    <!-- Simple sticky footer -->
    <footer class="app-footer" style="padding: 2rem 0; margin-top: auto;">
        <div class="footer-container" style="justify-content: center;">
            <span>知行合“医” - 专注每刻 © 2026</span>
        </div>
    </footer>
    <script src="js/api.js?v=20261010c"></script>
    <script src="../doctor-web/js/account.js?v=20261010c"></script>
</body>
</html>
