<main id="careShell" class="care-shell" data-care-role="patient">
<h1>关注与真实日期记录</h1>
<p class="care-intro">查看当前获准档案的关注事项、原提交材料，以及按实际日期保存的自助周期与修订历史。执行、质量与验收状态分别展示；筛查结果不等同于临床诊断。</p>
<div class="care-controls"><label for="carePatient">当前获准档案</label><select id="carePatient"><option value="">正在读取…</option></select><button id="careRefresh" type="button">重新读取</button></div>
<p id="careMessage" class="care-status" role="status" aria-live="polite">正在读取当前获准资料…</p><p id="careCoverage" class="care-coverage"></p>
<div class="care-grid"><section class="care-section" aria-labelledby="attentionTitle"><h2 id="attentionTitle">关注事项</h2><div id="careAttention"></div></section><section class="care-section" aria-labelledby="cyclesTitle"><h2 id="cyclesTitle">真实日期自助周期</h2><p>查看服务器覆盖率、缺失日期和每次修订；原记录时间未知时保留未知。</p><div id="careCycles"></div></section></div>
<section aria-label="原提交材料" id="careEvidence" class="care-detail"></section><section aria-label="周期日期与覆盖率" id="careCycleDetails" class="care-detail"></section><section aria-label="日期修订历史" id="careHistory" class="care-detail"></section>
</main>

</body></html>
