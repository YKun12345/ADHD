# 仅 MySQL 8 的一次性编排：本地把 SQLite backend/app.db 迁到 MySQL 用。
#
# 与 deploy/docker-compose.yml（全栈云端部署）相互独立：这里只起数据库，
# 并把 3306 绑定到本机回环 127.0.0.1，便于在宿主机直接跑迁移脚本连接。
#
# 用法（在仓库根执行）：
#   1) 起库（首次自动按 init_mysql.sql 建空库 adhd_demo，utf8mb4/InnoDB）
#        docker compose -f deploy/docker-compose.mysql.yml up -d
#   2) 一键迁移（口令与下方 MYSQL_* 保持一致即可）
#        python scripts/migrate_sqlite_to_mysql.py
#   3) 验库后停止
#        docker compose -f deploy/docker-compose.mysql.yml down
#       （要连数据卷一起清掉，再重来：down -v）
#
# 说明：
#   - MYSQL_DATABASE 只创建空库；表结构由迁移脚本/后端 create_all（模型权威）自动创建，
#     与本仓库"运行期建表"策略一致（不依赖手写 DDL）。
#   - init_mysql.sql 挂到 /docker-entrypoint-initdb.d 只在数据卷首次初始化时执行一次。
#   - 口令请避开 URL 保留字符：@ : / ? # [ ] 等。
#   - 仅监听本机 127.0.0.1，不对外暴露，避免把库直接扔到局域网/公网。

services:
  db:
    image: mysql:8.0
    container_name: adhd-mysql-migrate
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-adhd-migrate-root-pw}
      MYSQL_DATABASE: ${MYSQL_DB:-adhd_demo}
      MYSQL_USER: ${MYSQL_USER:-adhd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-adhd-migrate-pw}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - adhd_mysql_migrate_data:/var/lib/mysql
      - ../backend/sql/init_mysql.sql:/docker-entrypoint-initdb.d/01_init_mysql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  adhd_mysql_migrate_data:
