# ADHD FastAPI 反向代理（宿主 nginx → 容器 API:8000）
# 目标环境：Ubuntu + nginx。域名先解析到本机公网 IP。
#
# 快速启用（把下面的 server_name 换成你的域名）：
#   sudo cp deploy/nginx/backend.conf /etc/nginx/sites-available/adhd
#   sudo ln -s /etc/nginx/sites-available/adhd /etc/nginx/sites-enabled/adhd
#   sudo nginx -t && sudo systemctl reload nginx
# 如需 HTTPS（小程序强制要求）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.your-domain.com
# certbot 会自动改写本配置并续期。

server {
    listen 80;
    # 使用域名；纯 IP 直连演示可保留下一条 listen 并把 server_name 注释掉
    server_name api.your-domain.com;
    # server_name _;

    # 上传接口允许 10MB，预留余量
    client_max_body_size 16m;

    # 视频/长请求用到的超时（AI 接口可能较慢）
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
