<main id="messageShell" class="care-shell" data-message-role="doctor">
<h1>共享消息</h1><p>查看本人当前获准的具体关系及服务器消息。发送与重试请在医生小程序的“共享消息”中完成。</p>
<div class="care-controls"><label for="messagePatient">获准档案</label><select id="messagePatient"></select><label for="messageRelationship">接收关系</label><select id="messageRelationship"></select><button id="messageRefresh" type="button">重新读取</button></div>
<p id="messageStatus" class="care-status" role="status" aria-live="polite">正在核对当前账号…</p>
<p>医生值守时间暂未配置，不代表全天响应。查看只表示当前账号已查看，不代表专业处理或事项解决。</p>
<section id="messageItems" aria-label="本人原关系的服务器消息"></section>
<p>旧版本消息缺少当时具体关系与原授权依据，无法核验的历史不投射到当前关系。</p>
</main>
<script src="js/session-guard.js?v=20261016-messages"></script><script src="js/api.js?v=20261016-messages"></script><script src="js/shared-message-view.js?v=20261016-messages"></script>
