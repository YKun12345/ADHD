<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型候选与版本 | 知行合医</title><link rel="stylesheet" href="css/assessment-page.css"><style>label{display:block;margin:12px 0}textarea,input,select{max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:90px}pre,p{white-space:pre-wrap;overflow-wrap:anywhere}article{padding:12px;border-bottom:1px solid #ccd5df}</style></head>
<body><main class="assessment-shell"><a href="doctor_patients.html">返回工作台</a><h1>模型候选、审查与唯一版本</h1><p>需要实际机构审核权限。登记候选不会启用推理；来源、用途和输入契约分别核对，全部实际推理实例须提供签名加载证明。</p><p id="registryStatus" role="status"></p><button id="registryRefresh">重新读取</button><button id="registryRecover" hidden>按原编号查询</button><button id="registryRetry" hidden>确认重试原件</button><button id="registryArchive" hidden>保留并归档未保存原件</button><div id="registryVersions"></div>
<details><summary>登记已存放在可信目录中的候选包</summary><form id="registryCandidate"><label>模型版本<input name="version" maxlength="64" required></label><label>可信目录内包文件名<input name="artifact_file" required></label><label>包 SHA-256<input name="artifact_sha256" pattern="[a-f0-9]{64}" required></label><label>输入数值契约摘要<input name="input_contract_digest" pattern="[a-f0-9]{64}" required></label><label>用途<select name="purpose"><option value="research_only">仅研究</option><option value="screening_support">筛查辅助</option></select></label><label>代码来源与许可引用<textarea name="code_source" required></textarea></label><label>权重来源与许可引用<textarea name="weight_source" required></textarea></label><label>训练数据与用途引用<textarea name="training_data_source" required></textarea></label><button>明确登记候选</button></form></details>
<section><h2>针对实际候选执行操作</h2><form id="registryAction"><label>实际候选<select id="registryVersion" required></select></label><label>操作<select id="registryKind"><option value="review">分别审查来源和用途</option><option value="load_proof">记录实际实例加载证明</option><option value="activate">明确激活已准入版本</option><option value="rollback">明确回滚至已使用版本</option></select></label><div id="registryReview"></div><label id="registryProofLabel" hidden>实例生成的签名加载证明 JSON<textarea id="registryProof"></textarea></label><label>实际理由<textarea id="registryReason" maxlength="2000" required></textarea></label><button id="registrySubmit">明确确认此操作</button></form></section></main><script src="js/session-guard.js?v=20261017"></script><script src="js/api.js?v=20261017-agent"></script><script src="js/model-registry.js?v=20261017"></script></body></html>
